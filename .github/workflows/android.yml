# Builds the Android app for the .NET-Android head (Slopterm.Android). The build needs the
# Android SDK/JDK + the `android` .NET workload, so it lives here rather than on the dev box.
# This is currently the only way the Android head is verified to compile/package - treat a red
# run as "the Android port is broken", same weight as the desktop CI.
#
# This workflow only VERIFIES the build. Signing and the Google Play upload live in
# versioned-release.yml, which is the workflow an actual release goes through - deliberately not
# here, because a tag pushed by versioned-release.yml's own `gh release create` could never
# trigger this one (events raised with GITHUB_TOKEN don't start new workflow runs).
name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', 'core/**', 'web/**', 'VERSION', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'core/**', 'web/**', 'VERSION', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the Android .NET workload
        run: dotnet workload install android

      # The React UI is embedded into Slopterm.Core (vite outputs to core/wwwroot), so it must
      # be built before the Android project compiles Core.
      - name: Build the web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      # Unsigned (well: debug-key-signed, which is what .NET for Android falls back to when
      # $(AndroidKeyStore) isn't set). The real signing happens in versioned-release.yml.
      - name: Publish the Android app
        working-directory: android
        run: dotnet publish -c Release -f net10.0-android

      - uses: actions/upload-artifact@v4
        with:
          name: slopterm-android-unsigned
          path: |
            android/bin/Release/net10.0-android/**/*.apk
            android/bin/Release/net10.0-android/**/*.aab
          if-no-files-found: error
