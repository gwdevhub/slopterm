# Hand-written R8 rules, on top of the SDK's proguard_xamarin.cfg and the generated
# proguard_project_references.cfg (which keeps every type that has an Android Callable Wrapper).
# See the "App optimization (R8)" section of PLAY_RELEASE.md.

# R8 inlines resource IDs and then drops the R classes as unreachable - nothing in the *Java*
# code looks them up. The managed side does: .NET for Android resolves the constants in the
# generated resource designer by reflecting over com.gwdevhub.slopterm.R$* at startup, which R8
# cannot see. Without these, Resource.Drawable.ic_launcher (SessionKeepAliveService's foreground
# notification icon) resolves to a bogus id and startForeground throws.
-keep class com.gwdevhub.slopterm.R { *; }
-keep class com.gwdevhub.slopterm.R$* { *; }
